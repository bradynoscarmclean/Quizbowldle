name: Generate daily puzzles

on:
  schedule:
    - cron: '0 4 * * *' # every day at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate puzzles for the coming week
        run: node scripts/generate.mjs
      - name: Refresh the answer list used for spelling suggestions
        run: node scripts/build-vocab.mjs
      - name: Commit new puzzles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add puzzles answers.json
          git diff --cached --quiet || git commit -m "Add daily puzzles"
          git push
